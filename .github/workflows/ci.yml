name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      # Later steps still run when an earlier check fails, so one run reports
      # every problem.
      - run: bun run lint
      - run: bun run typecheck
        if: success() || failure()
      - run: bun test
        if: success() || failure()
      - run: bun run build
        if: success() || failure()
      - name: Compile the Pages Functions (fetch relay)
        if: success() || failure()
        run: ./node_modules/.bin/wrangler pages functions build --outdir=/tmp/functions-build
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist/client
          retention-days: 7

  e2e:
    name: Browser smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist/client
      - name: Install Playwright (outside the project, so the lockfile is untouched)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - timeout-minutes: 5
        run: node tests/e2e/smoke.mjs dist/client /tmp/pw/node_modules/playwright "$PWD/node_modules/jszip"
      - name: Cover regression test
        if: success() || failure()
        timeout-minutes: 5
        run: node tests/e2e/covers.mjs dist/client /tmp/pw/node_modules/playwright "$PWD/node_modules/jszip" chromium
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The checkout provides functions/ (the fetch relay), which wrangler
      # bundles alongside the static site.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist/client
      - name: Skip when Cloudflare secrets are missing
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy dist/client --project-name=aurumlux --branch=main --commit-dirty=true
