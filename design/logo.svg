<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1f2750"/>
      <stop offset="0.55" stop-color="#131938"/>
      <stop offset="1" stop-color="#0a0d1e"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="170" y1="130" x2="340" y2="380">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe3ef"/>
      <stop offset="1" stop-color="#a3abc6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.88  0 0 0 0 1  0 0 0 0.38 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>
  <g id="art" fill="none" stroke="url(#silver)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- the A: two sides meeting at the apex, base dipping to the book's spine -->
    <path d="M136 352 L256 136 L376 352 L256 382 Z"/>
    <!-- bookmark cord -->
    <path d="M256 176 V286" stroke-width="3.5"/>
    <!-- upper page edges (the "wings") -->
    <path d="M256 294 C 252 274, 234 264, 214 276" stroke-width="3.8"/>
    <path d="M256 294 C 260 274, 278 264, 298 276" stroke-width="3.8"/>
    <!-- fanned pages, spreading from the foot of the spine -->
    <path d="M256 376 C 250 338, 214 312, 180 312" stroke-width="3.6"/>
    <path d="M256 376 C 262 338, 298 312, 332 312" stroke-width="3.6"/>
    <path d="M256 376 C 248 348, 206 326, 166 326" stroke-width="3.6"/>
    <path d="M256 376 C 264 348, 306 326, 346 326" stroke-width="3.6"/>
    <path d="M256 376 C 246 358, 196 340, 154 338" stroke-width="3.6"/>
    <path d="M256 376 C 266 358, 316 340, 358 338" stroke-width="3.6"/>
    <path d="M256 376 C 244 366, 186 352, 144 349" stroke-width="3.6"/>
    <path d="M256 376 C 268 366, 326 352, 368 349" stroke-width="3.6"/>
  </g>
  <!-- ribbon bookmark with a notched tail -->
  <path d="M251 282 H261 V326 L256 319 L251 326 Z" fill="url(#silver)" filter="url(#glow)"/>
</svg>
